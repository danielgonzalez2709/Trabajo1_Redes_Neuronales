# Demo Parte 1 (< 2 min) — Spec §6.8: Rastrigin 2D, PSO vs GD, 5 corridas -> tabla en consola + figura de trayectoria.
# Hereda todo de base.yaml (§4.1 [DECIDIDO 9-oct]) y solo escribe lo que cambia.
hereda: base.yaml
func: [rastrigin]
dim: [2]
methods: [pso, gdfijo]
runs: 5
salida: results/data/part1_demo               # carpeta propia: el demo no escribe en la del experimento completo
tablas: results/tables/part1_demo             # ídem para los CSV
figura_trayectoria: true                      # §6.8: results/data/part1_demo/trayectoria_rastrigin_2d.png
