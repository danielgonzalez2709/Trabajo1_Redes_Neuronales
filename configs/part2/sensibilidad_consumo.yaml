# Sensibilidad de consumo — Spec §7.5 (T3.6): barrido de w solo con MMAS (10 corridas) y envolvente recalculada.
#   python run.py part2 --config configs/part2/sensibilidad_consumo.yaml                              # 5,6 l/100 km
#   python run.py part2 --config configs/part2/sensibilidad_consumo.yaml --set costo.consumo_l100=6.2 # 6,2 l/100 km
# Requiere el barrido base (sweep_w.yaml) en la misma experimento.salida; escribe en <salida>/sensibilidad/consumo<c>/.
hereda: sweep_w.yaml
methods: [aco]                # §7.5: la sensibilidad se repite con MMAS
costo:
  consumo_l100: 5.6           # §7.5 y §7.2 Bloque 5: fase "extra alta" del catálogo, 5,6 y 6,2 l/100 km
experimento:
  variantes_aco: [mmas]       # §7.5: solo MMAS
